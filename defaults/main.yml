---
# Path to the template file for interfaces
ifupdown_interface_template: etc/network/interfaces.j2

# Define the name of the package which installs ifupdown
# ifupdown_package: "ifupdown"

# Defines all dns servers to configure
ifupdown_dns_nameservers:
  - 8.8.8.8
  - 8.8.4.4

# Defines your global dns suffix search
# ifupdown_dns_search: example.org

# Defines if interfaces, bonds, bridges, vlans, ovs_bonds, ovs_bridges and
# ovs_interfaces should be brought up after defining. This can be overridden
# with the `enable` option per interface. Please see the examples below.
ifupdown_enable_configured_interfaces_after_defining: false

# Defines non Open vSwitch network bonds
ifupdown_network_bonds:
  []
  # - name: bond0
  #   address: 192.168.1.10
  #   netmask: 255.255.255.0
  #   configure: true
  #   enable: false
  #   comment: Bond Group 0
  #   method: static
  #   parameters:
  #     - param: bond_mode
  #       val: active-backup
  #     - param: bond_miimon
  #       val: 100
  #     # - param: miimon
  #     #   val: 100
  #     # - param: mode
  #     #   val: active-backup
  #     - param: primary
  #       val: enp0s9
  #   slaves:
  #     - enp0s9
  #     - enp0s10

# Defines non Open vSwitch network bridges
ifupdown_network_bridges:
  []
  # - name: br0
  #   configure: true
  #   enable: false
  #   comment: Bridge 0
  #   method: static
  #   address: 192.168.1.11
  #   netmask: 255.255.255.0
  #   netmask_cidr: 24
  #   gateway: 192.168.1.1
  #   parameters:
  #     - param: bridge_stp
  #       val: off
  #     - param: bridge_fd
  #       val: 0
  #     # - param: up route add default gw
  #     #   val: 10.0.106.1
  #   ports:
  #     - enp0s16

# Defines non Open vSwitch network interfaces
ifupdown_network_interfaces:
  []
  # - name: enp0s3
  #   configure: true
  #   enable: false
  #   method: dhcp
  #   parameters:
  #     - param: pre-up sleep
  #       val: 2
  # - name: enp0s8
  #   configure: true
  #   method: static
  #   address: 192.168.250.10
  #   netmask: 255.255.255.0
  # - name: enp0s9
  #   configure: true
  #   comment: bond0 member
  #   method: manual
  #   parameters:
  #     - param: bond_master
  #       val: bond0
  # - name: enp0s10
  #   configure: true
  #   comment: bond0 member
  #   method: manual
  #   parameters:
  #     - param: bond_master
  #       val: bond0
  # - name: enp0s16
  #   configure: true
  #   comment: br0 member
  #   method: manual

# Defines non Open vSwitch network vlans
ifupdown_network_vlans:
  []
  # - name: enp0s8.100
  #   configure: true
  #   enable: false
  #   comment: VLAN 100
  #   method: manual
  #   address:
  #   netmask:
  #   netmask_cidr:
  #   gateway:
  #   vlan_device: enp0s8

# Defines Open vSwitch bonds
ifupdown_ovs_bonds:
  []
  # - name: bond0
  #   # address:
  #   bridge: vmbr0
  #   comment: OVS Bond
  #   configure: true
  #   enable: false
  #   # gateway:
  #   method: manual
  #   # netmask:
  #   # netmask_cidr:
  #   options:
  #     - opt: bond_mode
  #       val: active-backup
  #     - opt: lacp
  #       val: off
  #   # parameters:
  #   #   - param: ''
  #   #     val: ''
  #   ports:
  #     - enp0s9
  #     - enp0s10

# Defines Open vSwitch bridges
ifupdown_ovs_bridges:
  []
  # - name: vmbr0
  #   # address:
  #   comment: OVS Bridge
  #   configure: true
  #   enable: false
  #   # gateway:
  #   method: manual
  #   # netmask:
  #   # netmask_cidr:
  #   # options:
  #   #   - opt: ""
  #   #     val: ""
  #   # parameters:
  #   #   - param: ""
  #   #     val: ""
  #   ports:
  #     # - enp0s9
  #     # - enp0s10
  #     - bond0
  #     - vlan1

# Defines Open vSwitch interfaces
ifupdown_ovs_interfaces:
  []
  # - name: vlan1
  #   address:
  #   bridge: vmbr0
  #   comment: VLAN1
  #   configure: true
  #   enable: false
  #   gateway:
  #   method: static
  #   netmask:
  #   netmask_cidr:
  #   # options:
  #   #   - opt: vlan_mode
  #   #     val: access
  #   # parameters:

# Defines Open vSwitch ports
ifupdown_ovs_ports:
  []

# Install or not lldp
ifupdown_install_lldp: false

# Source or not the content of the interfaces.d subdirectory 
ifupdown_source_interfaces_d: false
